<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>互动3D壁纸</title>
    <link rel="stylesheet" href="../ui/tokens.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>

    <main class="pages">
        <!-- ====== 壁纸 ====== -->
        <section class="page" data-page="wallpaper" aria-label="壁纸">
            <header class="topbar"><h1>互动 3D 壁纸</h1></header>
        </section>

        <!-- ====== 视差 ====== -->
        <section class="page" data-page="parallax" aria-label="视差" hidden>
            <header class="topbar"><h1>视差</h1></header>
        </section>

        <!-- ====== 设置 ====== -->
        <section class="page" data-page="system" aria-label="设置" hidden>
            <header class="topbar"><h1>设置</h1></header>
        </section>
    </main>

    <nav class="tabbar" role="tablist">
        <button type="button" data-tab="wallpaper" role="tab"><span class="pill"><svg class="i"><use href="#i-image"/></svg></span>壁纸</button>
        <button type="button" data-tab="parallax" role="tab"><span class="pill"><svg class="i"><use href="#i-layers"/></svg></span>视差</button>
        <button type="button" data-tab="system" role="tab"><span class="pill"><svg class="i"><use href="#i-settings"/></svg></span>设置</button>
    </nav>

    <div id="toast" class="toast glass" role="status" hidden></div>

    <!-- Pixi.js -->
    <script src="../wallpaper/pixi.min.js"></script>

    <!-- 共享模块 -->
    <script src="../shared/config.js"></script>
    <script src="../shared/image_loader.js"></script>
    <script src="../shared/parallax-math.js"></script>
    <script src="../shared/shaders.js"></script>
    <script src="../shared/frame-pacing.js"></script>
    <script src="../shared/config-sync.js"></script>
    <script src="../shared/core_engine.js"></script>

    <!-- 界面基础 -->
    <script src="../ui/icons.js"></script>
    <script src="bridge.js"></script>
    <script src="controls.js"></script>
    <script src="shell.js"></script>
    <script src="main.js"></script>

</body>
</html>
